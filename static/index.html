<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>kontract theme starter</title>
  <style>
    :root { --bg:#111518; --surface:#192124; --line:#3b4954; --hi:#f3f5f7; --mid:#9fafbc; --accent:#00ff6f; }
    body { background:var(--bg); color:var(--mid); font-family:ui-monospace,monospace; margin:0; padding:32px; }
    h1 { color:var(--hi); font-size:20px; margin:0 0 4px; }
    .sub { font-size:12px; margin-bottom:24px; }
    .sub b { color:var(--accent); }
    section { border:1px solid var(--line); background:var(--surface); border-radius:6px; padding:14px 16px; margin-bottom:14px; }
    section h2 { color:var(--hi); font-size:13px; margin:0 0 10px; text-transform:uppercase; letter-spacing:.1em; }
    .item { display:flex; gap:12px; align-items:baseline; padding:6px 0; border-top:1px solid rgba(59,73,84,.4); font-size:13px; flex-wrap:wrap; }
    .item b { color:var(--hi); }
    .bar { flex:1 1 120px; height:6px; background:#263237; border-radius:3px; overflow:hidden; min-width:80px; }
    .bar i { display:block; height:100%; background:var(--accent); }
    .phase-Live { color:var(--accent); }
    .phase-Failed { color:#fb2c37; }
    .err { color:#fb2c37; }
    a { color:var(--accent); }
  </style>
</head>
<body>
  <h1>kontract theme starter</h1>
  <div class="sub">a minimal theme — replace this UI with your metaphor · powered by <b>the kontract</b></div>
  <div id="root">loading…</div>

  <script src="kontract.js"></script>
  <script>
    const root = document.getElementById("root");
    // The org namespace arrives as a query param from the launcher (?org=…),
    // falling back to a path segment if you deploy per-org.
    const org = new URLSearchParams(location.search).get("org");

    // API data is org-controlled, not theme-controlled — escape it anyway
    // before it reaches innerHTML.
    const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
    function zoneRow(z) {
      const cap = parseFloat(z.status?.capacity_cpu || "0") || 0;
      const used = parseFloat(z.status?.allocated_cpu || "0") || 0;
      const pct = cap ? Math.min(100, (used / cap) * 100) : 0;
      return `<div class="item"><b>${esc(z.name)}</b> <span>${esc(z.band)}${z.free ? " · free" : ""}</span>
        <span class="bar"><i style="width:${pct}%"></i></span>
        <span>${used}/${cap} cpu · ${esc(z.status?.apps ?? 0)} apps</span></div>`;
    }
    function appRow(a) {
      const url = typeof a.status?.url === "string" && a.status.url.startsWith("https://") ? a.status.url : "";
      return `<div class="item"><b>${esc(a.app_name || a.name)}</b>
        <span class="phase-${esc(a.status?.phase || "")}">${esc(a.status?.phase || "—")}</span>
        ${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(url.replace("https://",""))}</a>` : ""}
      </div>`;
    }

    // Unlaunched visitors get a tour, not a dead end: what a theme is, a
    // sample-data preview of what this page renders once launched, and the
    // steps to make one of their own.
    const SAMPLE_ZONES = [
      { name: "production", band: "small", free: true,  status: { capacity_cpu: "10", allocated_cpu: "6", apps: 3 } },
      { name: "staging",    band: "small", free: false, status: { capacity_cpu: "10", allocated_cpu: "2", apps: 1 } },
    ];
    const SAMPLE_APPS = [
      { app_name: "storefront", status: { phase: "Live", url: "https://storefront.example.com" } },
      { app_name: "checkout",   status: { phase: "Building" } },
    ];
    function renderWelcome() {
      root.innerHTML = `
        <section><h2>what is this?</h2>
          <div class="item">You're looking at a <b>kontract theme</b> — a frontend that lives in its own Git repository and is built, deployed, and served by the Konstruct platform's own delivery pipeline. Once launched from Konstruct it renders your organization's zones (capacity you own) and apps (things you've shipped) — using any metaphor its author chooses: planets, neighborhoods, race teams, or plain business like this one.</div>
        </section>
        <section><h2>preview — sample data</h2>
          <div class="item">When launched with your session, the sections below show your real organization instead of these examples.</div>
          <div class="item" style="border-top:none"><b style="letter-spacing:.1em">ZONES</b></div>
          ${SAMPLE_ZONES.map(zoneRow).join("")}
          <div class="item"><b style="letter-spacing:.1em">APPS</b></div>
          ${SAMPLE_APPS.map(appRow).join("")}
        </section>
        <section><h2>next steps</h2>
          <div class="item">1 · Open this theme from <b>Konstruct → PaaS → Kontracts</b> — this page comes alive with your org's data. Your session never leaves Konstruct; the theme asks the platform for data over postMessage.</div>
          <div class="item">2 · Make it yours: fork this repository, replace the UI, keep <b>kontract.js</b>. Push to your branch and the platform rebuilds and redeploys it automatically.</div>
          <div class="item">3 · Read the theme authoring guide (<b>KONTRACT.md</b> in this repository) — or point an AI assistant at it and describe your metaphor.</div>
        </section>`;
    }

    async function render() {
      if (!kontract.isLaunched()) {
        renderWelcome();
        return;
      }
      if (!org) {
        root.innerHTML = "<section><h2>no org</h2><div class='item'>Launcher must pass ?org=&lt;namespace&gt;.</div></section>";
        return;
      }
      try {
        const d = await kontract.discover(org);
        const zones = await kontract.zones(org).catch(() => ({ zones: [] }));
        const apps = await kontract.apps(org).catch(() => ({ apps: [] }));
        // The contract API returns bare arrays; tolerate envelopes too.
        const zoneList = Array.isArray(zones) ? zones : (zones.zones || []);
        const appList = Array.isArray(apps) ? apps : (apps.apps || []);
        const zoneRows = zoneList.map(zoneRow).join("") || "<div class='item'>no zones yet</div>";
        const appRows = appList.map(appRow).join("") || "<div class='item'>no apps yet</div>";
        root.innerHTML = `
          <section><h2>org</h2><div class="item"><b>${esc(d.org?.display_name || org)}</b><span>capabilities: ${esc((d.capabilities||[]).join(", "))}</span></div></section>
          <section><h2>zones</h2>${zoneRows}</section>
          <section><h2>apps</h2>${appRows}</section>`;
      } catch (e) {
        root.innerHTML = `<section><h2>error</h2><div class="item err">${esc(e.message)}</div></section>`;
      }
    }
    render();
    setInterval(render, 15000);
  </script>
</body>
</html>
